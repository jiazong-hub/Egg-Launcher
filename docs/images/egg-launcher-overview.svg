<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Egg Launcher 双模式工作示意图</title>
  <desc id="desc">Egg Launcher 选择 OpenAI 在线模式或 llama.cpp 本地模式，再启动同一个 ChatGPT Desktop 客户端。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eaf4fb"/>
    </linearGradient>
    <linearGradient id="egg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8eeaff"/>
      <stop offset="0.52" stop-color="#267cf2"/>
      <stop offset="1" stop-color="#7358e8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#6b91b2"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#background)"/>
  <text x="64" y="66" fill="#163552" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="32" font-weight="700">一个桌面客户端，两种运行模式</text>
  <text x="66" y="104" fill="#52718c" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">在 Egg Launcher 中选择运行环境，再启动 ChatGPT Desktop</text>

  <!-- Connector paths: launcher branches to the selected provider and both paths use the same desktop client. -->
  <path d="M374 270 H414 V198 H456" fill="none" stroke="#6b91b2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M414 270 V374 H456" fill="none" stroke="#6b91b2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M744 198 H786 V270" fill="none" stroke="#6b91b2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M744 374 H786 V270" fill="none" stroke="#6b91b2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M786 270 H826" fill="none" stroke="#6b91b2" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="64" y="184" width="310" height="172" rx="24" fill="#ffffff" stroke="#c5d9e8" stroke-width="2"/>
  <ellipse cx="129" cy="270" rx="27" ry="38" fill="url(#egg)"/>
  <ellipse cx="129" cy="270" rx="46" ry="13" fill="none" stroke="#586fe5" stroke-width="5" transform="rotate(-22 129 270)"/>
  <ellipse cx="129" cy="270" rx="44" ry="11" fill="none" stroke="#8ceaff" stroke-width="2" transform="rotate(-22 129 270)"/>
  <text x="190" y="255" fill="#163552" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Egg Launcher</text>
  <text x="190" y="288" fill="#52718c" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">选择模式 · 管理配置</text>
  <text x="190" y="314" fill="#52718c" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">并启动客户端</text>

  <rect x="456" y="140" width="288" height="116" rx="22" fill="#ffffff" stroke="#b8d7eb" stroke-width="2"/>
  <circle cx="494" cy="178" r="9" fill="#1686e8"/>
  <text x="516" y="184" fill="#163552" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="700">OpenAI 在线模式</text>
  <text x="484" y="220" fill="#52718c" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">使用官方服务与 OpenAI 模型</text>

  <rect x="456" y="316" width="288" height="116" rx="22" fill="#ffffff" stroke="#b8d7eb" stroke-width="2"/>
  <circle cx="494" cy="354" r="9" fill="#10a7a0"/>
  <text x="516" y="360" fill="#163552" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="700">Local 本地模式</text>
  <text x="484" y="396" fill="#52718c" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">llama.cpp Runtime + GGUF 模型</text>

  <rect x="826" y="202" width="310" height="136" rx="24" fill="#163f65"/>
  <rect x="854" y="232" width="36" height="29" rx="5" fill="none" stroke="#9deaff" stroke-width="3"/>
  <path d="M862 271 H882 M872 261 V271" fill="none" stroke="#9deaff" stroke-width="3" stroke-linecap="round"/>
  <text x="908" y="253" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">ChatGPT Desktop</text>
  <text x="854" y="304" fill="#c7e1f2" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">同一个客户端，按所选模式运行</text>

  <text x="64" y="484" fill="#52718c" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">OpenAI 与 Local 模式互斥；切换前请先关闭 ChatGPT Desktop。</text>
</svg>
