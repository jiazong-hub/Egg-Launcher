<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Egg Launcher 托盘图标候选</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #07182a; color: #eef7ff; font: 15px "Microsoft YaHei UI", sans-serif; }
    h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
    .sub { margin-bottom: 24px; color: #9dbbd5; }
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .panel { min-height: 230px; padding: 18px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .dark { background: #0a2138; border: 1px solid #245f88; }
    .light { background: #eef3f7; color: #173149; border: 1px solid #bdd0df; }
    .large { width: 146px; height: 146px; }
    .label { margin-top: 12px; font-weight: 600; }
    .sizes { margin-top: 20px; padding: 16px 18px; border: 1px solid #245f88; border-radius: 12px; background: #0a2138; }
    .size-row { display: flex; align-items: end; gap: 30px; min-height: 62px; }
    .sample { min-width: 72px; text-align: center; color: #9dbbd5; }
    .sample div { height: 38px; display: flex; align-items: center; justify-content: center; }
    .sample img { display: block; }
    .sample span { display: block; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>蛋形轮廓托盘图标</h1>
  <div class="sub">无中间光带 · 无内部高光 · 蓝青渐变轮廓 · 深浅任务栏兼容</div>
  <div class="panels">
    <div class="panel dark"><img class="large" src="egg-tray-outline.svg" alt="深色背景效果"><div class="label">深色背景</div></div>
    <div class="panel light"><img class="large" src="egg-tray-outline.svg" alt="浅色背景效果"><div class="label">浅色背景</div></div>
  </div>
  <div class="sizes">
    <div class="size-row">
      <div class="sample"><div><img src="egg-tray-outline.svg" width="16" height="16" alt="16 像素"></div><span>16 px</span></div>
      <div class="sample"><div><img src="egg-tray-outline.svg" width="20" height="20" alt="20 像素"></div><span>20 px</span></div>
      <div class="sample"><div><img src="egg-tray-outline.svg" width="24" height="24" alt="24 像素"></div><span>24 px</span></div>
      <div class="sample"><div><img src="egg-tray-outline.svg" width="32" height="32" alt="32 像素"></div><span>32 px</span></div>
      <div class="sample"><div><img src="egg-tray-outline.svg" width="48" height="48" alt="48 像素"></div><span>48 px</span></div>
    </div>
  </div>
</body>
</html>
